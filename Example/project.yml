name: HitchTrackerExample
options:
  bundleIdPrefix: io.sentry
  deploymentTarget:
    iOS: "26.0"
packages:
  HitchTracker:
    path: ..
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.30.2"
targets:
  HitchTrackerExample:
    type: application
    platform: iOS
    sources:
      - HitchTrackerExample
    dependencies:
      - package: HitchTracker
        product: HitchTracker
      - package: HitchTracker
        product: HitchTrackerBacktraceC
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sentry.HitchTrackerExample
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
